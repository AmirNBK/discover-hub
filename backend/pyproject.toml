[project]
name = "discoverhub-backend"
version = "1.0.0"
description = "Django and MongoDB API for DiscoverHub"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.0,<5.3",
    "django-mongodb-backend==5.2.4",
    "python-dotenv>=1.1,<2",
    "waitress>=3.0,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
